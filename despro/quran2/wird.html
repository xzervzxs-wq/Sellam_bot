        * {

            margin: 0;
            padding: 0;

        html, body, #root {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #FDFBF7;
            color: #2d3748;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .font-amiri { font-family: 'Amiri', serif; }
        .font-cairo { font-family: 'Cairo', sans-serif; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-bounce-slow { animation: float 6s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(6deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
            100% { transform: translateY(0px) rotate(6deg); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            z-index: 1000;
            border-top: 2px solid #c5a059;

        .nav-btn {

            align-items: center;
            gap: 4px;
            color: #fffbf2;
            opacity: 0.7;
            font-size: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            padding: 8px 16px;
            border-radius: 12px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .nav-btn.active {
            opacity: 1;
            color: #c5a059;
        }
        .nav-btn i {
            font-size: 20px;

  const [isLoading, setIsLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => { localStorage.setItem('wird_dailyGoal', dailyGoal); }, [dailyGoal]);
  useEffect(() => { localStorage.setItem('wird_currentPage', currentPageNum); }, [currentPageNum]);
  useEffect(() => { localStorage.setItem('wird_streak', streak); }, [streak]);
  useEffect(() => { localStorage.setItem('wird_startPage', startPageGoal); }, [startPageGoal]);
  useEffect(() => { localStorage.setItem('wird_lastReadDate', lastReadDate); }, [lastReadDate]);
  useEffect(() => { localStorage.setItem('wird_history', JSON.stringify(achievementLog)); }, [achievementLog]);
  useEffect(() => { localStorage.setItem('wird_notifications', notificationsEnabled); }, [notificationsEnabled]);
  useEffect(() => { localStorage.setItem('wird_reminderTime', reminderTime); }, [reminderTime]);

  // Request notification permission
  const requestNotificationPermission = async () => {
    if (!('Notification' in window)) {
      alert('متصفحك لا يدعم الإشعارات');
      return false;
    }
    
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
      setNotificationsEnabled(true);
      showTestNotification();
      return true;
    }
    return false;
  };

  const showTestNotification = () => {
    new Notification('الورد اليومي 📖', {
      body: 'تم تفعيل التذكيرات! سنذكرك بوردك اليومي إن شاء الله',
      icon: 'icons/icon-192.png',
      badge: 'icons/icon-72.png',
      tag: 'wird-test',
      dir: 'rtl'
    });
  };

  // Check and send notification based on time
  useEffect(() => {
    if (!notificationsEnabled) return;
    
    const checkTime = () => {
      const now = new Date();
      const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const today = now.toDateString();
      const lastNotification = localStorage.getItem('wird_lastNotificationSent');
      
      if (currentTime === reminderTime && lastReadDate !== today && lastNotification !== today) {
        if (Notification.permission === 'granted') {
          new Notification('حان وقت وردك! 📖', {
            body: `لم تقرأ وردك اليوم بعد. هيا نحافظ على سلسلة ${streak} يوم!`,
            icon: 'icons/icon-192.png',
            badge: 'icons/icon-72.png',
            tag: 'wird-reminder',
            dir: 'rtl',
            requireInteraction: true
          });
          localStorage.setItem('wird_lastNotificationSent', today);
        }
      }
    };
    
    // Check every minute
    const interval = setInterval(checkTime, 60000);
    checkTime(); // Check immediately
    
    return () => clearInterval(interval);
  }, [notificationsEnabled, reminderTime, lastReadDate, streak]);

  const toArabicNumerals = (num) => num.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

  const cacheNextPages = async (startPage) => {
    for (let i = 1; i <= 20; i++) {
      const targetPage = startPage + i;
      if (targetPage > 604) break;
      const cacheKey = `quran_page_${targetPage}`;
      if (localStorage.getItem(cacheKey)) continue;
      try {
        const response = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${targetPage}`);
        if (response.ok) {
          const data = await response.json();
          localStorage.setItem(cacheKey, JSON.stringify(data));
        }
      } catch (e) { console.log("Caching failed for page", targetPage); }
    }
  };

  const fetchPageData = async (pageNum) => {
    setIsLoading(true);
    setError(null);
    setShowMutashabih(false);

    const cacheKey = `quran_page_${pageNum}`;
    const cachedData = localStorage.getItem(cacheKey);

    if (cachedData) {
      processData(JSON.parse(cachedData));
      setIsLoading(false);
      cacheNextPages(pageNum);
      return;
    }

    try {
      const response = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${pageNum}`);
      if (!response.ok) throw new Error("فشل الاتصال بالخادم");
      
      const data = await response.json();
      try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) {}

      processData(data);
      cacheNextPages(pageNum);

    } catch (err) {
      console.error(err);
      setError("تأكد من اتصالك بالإنترنت");
    } finally {
      setIsLoading(false);
    }
  };

  const processData = (data) => {
    setPageVerses(data.verses);
    const startingSurahVerse = data.verses.find(v => v.verse_key.split(':')[1] === '1');
    if (startingSurahVerse) {
      const surahId = startingSurahVerse.verse_key.split(':')[0];
      setHeaderTitle(SURAH_DATA[surahId]?.name);
    } else {
      const firstVerseKey = data.verses[0].verse_key;
      const chapterId = firstVerseKey.split(':')[0];
      setHeaderTitle(SURAH_DATA[chapterId]?.name);
    }
  }

  useEffect(() => {
    if (currentView === 'reading') {
      fetchPageData(currentPageNum);
    }
  }, [currentPageNum, currentView]);

  const SurahHeader = ({ surahId }) => {

          <span className="text-[#1A4D2E] font-cairo font-black text-xl z-10 bg-[#FDFBF7] px-6">
             {name}

                >
                  <Plus className="w-5 h-5" />

            </div>
            
            {/* Notification Settings */}

                    <input

            >
              حفظ التغييرات
            </button>
          </div>
        </div>
      </div>
    );
  };

                  <p className="text-lg font-bold text-[#1A4D2E] font-cairo">{log.pages}</p>
                  <p className="text-[10px] text-[#8C8A84]">صفحات</p>
                </div>

  const GoalReachedModal = () => (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm animate-fade-in p-4" dir="rtl">

        <div className="absolute top-0 left-0 w-full h-full opacity-5 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
        <div className="relative z-10">
          <div className="w-20 h-20 bg-[#1A4D2E] rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-[#1A4D2E]/30 animate-bounce-slow">
            <Award className="w-10 h-10 text-[#D4AF37]" />
          </div>
          <h3 className="text-2xl font-black text-[#1A4D2E] font-cairo mb-2">أحسنت صنعاً!</h3>
          <p className="text-[#8C8A84] font-cairo mb-8 leading-relaxed">
            لقد أتممت وردك اليومي ({dailyGoal} صفحات). هل تود تسجيل هذا الإنجاز؟
          </p>
          <div className="space-y-3">
            <button 
              onClick={() => { 
                saveAchievement(); 
                setIsGoalReachedModalOpen(false); 
                setCurrentView('completed'); 
              }}
              className="w-full py-3.5 bg-[#1A4D2E] text-white rounded-xl font-bold font-cairo shadow-lg shadow-[#1A4D2E]/20 active:scale-95 transition"
            >
              إنهاء الورد وتسجيل الإنجاز
            </button>
            <button 
              onClick={() => setIsGoalReachedModalOpen(false)}
              className="w-full py-3.5 bg-white text-[#1A4D2E] border-2 border-[#1A4D2E]/10 rounded-xl font-bold font-cairo hover:bg-[#FDFBF7] active:scale-95 transition"
            >
              أرغب في الاستزادة
            </button>

  const HomeView = () => (

      <div className="flex justify-between items-center mb-10 pt-4">

            <div className="w-14 h-14 bg-gradient-to-br from-[#1A4D2E] to-[#0F2E1B] rounded-2xl flex items-center justify-center rotate-3 shadow-lg border border-[#D4AF37]/30">
                <Moon className="w-7 h-7 text-[#D4AF37]" />
            </div>
            <div>
                <h1 className="text-2xl font-black text-[#1A4D2E] font-cairo leading-none mb-1">وِردُك اليومي</h1>
                <p className="text-[#8C8A84] text-xs font-semibold font-cairo tracking-wide">
                  {new Date().toLocaleDateString('ar-SA', { weekday: 'long', month: 'long', day: 'numeric' })}
                </p>
            </div>
        </div>
        <button 
            onClick={() => setIsSettingsOpen(true)}
            className="w-12 h-12 rounded-2xl border border-[#D4AF37]/30 bg-white flex items-center justify-center hover:bg-[#FDFBF7] active:scale-95 transition shadow-sm text-[#D4AF37]"
        >
          <Settings className="w-6 h-6" />
        </button>
      </div>

      <div className="bg-[#1A4D2E] rounded-[32px] p-1 text-white shadow-xl shadow-[#1A4D2E]/20 mb-10 relative overflow-hidden group cursor-default transition-transform hover:scale-[1.02]">
        <div className="bg-gradient-to-br from-[#1A4D2E] to-[#0D2916] rounded-[28px] p-7 h-full relative z-10 border border-[#ffffff]/10">
          <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
          <div className="relative z-10 flex justify-between items-center">
            <div>
              <div className="flex items-center gap-2 mb-2">
                <Star className="w-4 h-4 text-[#D4AF37]" />
                <p className="text-[#D4AF37] text-sm font-cairo font-bold tracking-wide">إنجاز متواصل</p>
                <button 
                  onClick={(e) => { e.stopPropagation(); setIsHistoryOpen(true); }}
                  className="mr-2 p-1 bg-[#D4AF37]/20 rounded-full hover:bg-[#D4AF37]/40 transition-colors"
                  title="سجل الإنجازات"
                >
                  <History className="w-3 h-3 text-[#D4AF37]" />
                </button>

  const ReadingView = () => {
    
    const handleNext = () => {
      if (currentPageNum < 604) {
        const nextPage = currentPageNum + 1;
        const nextPagesRead = pagesReadToday + 1;
        
        if (nextPagesRead === dailyGoal) {
          handleGoalReached();
        }
        
        setCurrentPageNum(nextPage);
        setPagesReadToday(nextPagesRead);
      } else {
        setPagesReadToday(dailyGoal);
        setCurrentView('completed');
      }
    };

    const handlePrev = () => {
      if (currentPageNum > 1) {
        setCurrentPageNum(prev => prev - 1);
      }
    };

    const currentMutashabih = MUTASHABIH_DB[currentPageNum];

    return (
      <div className="flex flex-col h-full bg-[#FDFBF7]" dir="rtl">

            <ArrowLeft className="w-6 h-6 text-[#1A4D2E] rotate-180" />
          </button>
          <div className="text-center">
            {isLoading ? (
               <div className="h-6 w-24 bg-[#E8E6E1] animate-pulse rounded"></div>
            ) : (
               <h2 className="text-[#1A4D2E] font-bold font-cairo text-lg">{headerTitle}</h2>
            )}
            
            <div className="flex items-center justify-center gap-2 mt-1">
               <span className="h-[1px] w-8 bg-[#D4AF37]/40"></span>
               <p className="text-xs text-[#D4AF37] font-bold font-cairo">صفحة {toArabicNumerals(currentPageNum)}</p>
               <span className="h-[1px] w-8 bg-[#D4AF37]/40"></span>
            </div>
          </div>
          <div className="w-10"></div>
        </div>

        <div className="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col items-center relative pb-48">
          
          <div className="w-full max-w-2xl min-h-[500px] h-auto mb-10 px-2 sm:px-0">
             
             <div className="w-full h-full flex flex-col items-center py-4 relative min-h-[480px]">
                
                <div className="text-center w-full relative z-10 flex-1 flex flex-col items-center">
                    {isLoading && (
                      <div className="flex flex-col items-center gap-4 mt-20">
                        <Loader2 className="w-10 h-10 text-[#D4AF37]" />
                        <p className="text-[#8C8A84] font-cairo text-sm">جاري جلب الآيات...</p>
                      </div>
                    )}
                    {error && (
                      <div className="flex flex-col items-center gap-4 text-red-800 bg-red-50 p-6 rounded-2xl border border-red-100 mt-20">
                        <WifiOff className="w-8 h-8 opacity-50" />
                        <p className="font-cairo font-bold">{error}</p>
                        <button onClick={() => fetchPageData(currentPageNum)} className="text-sm underline">إعادة المحاولة</button>
                      </div>
                    )}
                    {!isLoading && !error && (
                      <div className="font-amiri text-2xl md:text-4xl text-[#1A1A1A] leading-[2.8] text-justify tracking-wide selection:bg-[#D4AF37]/20 w-full pb-8" dir="rtl">
                        {pageVerses.map((verse) => {
                          const verseNum = verse.verse_key.split(':')[1];
                          const surahId = verse.verse_key.split(':')[0];
                          
                          return (
                            <Fragment key={verse.id}>
                              {verseNum === '1' && <SurahHeader surahId={surahId} />}
                              
                              <span className="inline">
                                {verse.text_uthmani} <VerseMarker number={verseNum} />
                              </span>
                            </Fragment>
                          );
                        })}
                      </div>
                    )}
                </div>
             </div>
          </div>

          {currentMutashabih && !isLoading && (
            <div className="mt-8 w-full max-w-md animate-slide-up mb-6">
              <button 
                onClick={() => setShowMutashabih(!showMutashabih)}
                className={`flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-bold transition-all mx-auto shadow-sm font-cairo border
                  ${showMutashabih 
                    ? 'bg-[#FEF9E7] text-[#B58D1D] border-[#D4AF37]/40' 
                    : 'bg-white text-[#8C8A84] border-[#E8E6E1] hover:border-[#D4AF37]/40'}`}
              >
                <Info className="w-4 h-4" />
                {showMutashabih ? 'إخفاء التوجيه' : 'تنبيه متشابه'}
              </button>
              
              {showMutashabih && (
                <div className="mt-4 p-5 bg-[#FEF9E7] border border-[#D4AF37]/20 rounded-2xl text-center text-[#5C5A54] text-sm shadow-md animate-fade-in relative font-cairo leading-relaxed">
                   <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-[#FEF9E7] border-t border-l border-[#D4AF37]/20 rotate-45"></div>
                   <p><strong className="text-[#B58D1D]">فائدة: </strong>{currentMutashabih}</p>
                </div>
              )}
            </div>
          )}
        </div>

        <div className="p-5 bg-white border-t border-[#E8E6E1] shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.05)] fixed bottom-16 left-0 right-0 z-30">
          <div className="flex justify-between items-center max-w-md mx-auto" dir="ltr">
             <button 
              onClick={handlePrev}
              disabled={currentPageNum === 1 || isLoading}
              className="w-14 h-14 flex items-center justify-center rounded-2xl text-[#8C8A84] disabled:opacity-30 hover:bg-[#FDFBF7] border border-transparent hover:border-[#D4AF37]/20 transition"
            >
              <ChevronRight className="w-6 h-6" />
            </button>
            
            <div className="flex flex-col items-center gap-2 w-full px-6">
              <span className="text-xs text-[#D4AF37] font-bold font-cairo tracking-widest">{pagesReadToday} / {dailyGoal} من الورد</span>
              <div className="h-2 w-full bg-[#E8E6E1] rounded-full overflow-hidden" dir="rtl">
                <div 
                  className="h-full bg-[#D4AF37] transition-all duration-500 ease-out rounded-full shadow-[0_0_10px_rgba(212,175,55,0.5)]"
                  style={{ width: `${Math.min((pagesReadToday / dailyGoal) * 100, 100)}%` }}
                ></div>
              </div>
            </div>

            <button 
              onClick={handleNext}
              disabled={isLoading}
              className="w-14 h-14 flex items-center justify-center rounded-2xl bg-[#1A4D2E] text-[#D4AF37] shadow-lg shadow-[#1A4D2E]/20 active:scale-95 transition hover:bg-[#143d24] border border-[#D4AF37]/30"
            >
              <ChevronLeft className="w-6 h-6" />
            </button>
          </div>
        </div>
      </div>
    );
  };

  const CompletedView = () => (
    <div className="flex flex-col h-full items-center justify-center p-8 bg-[#1A4D2E] text-white text-center animate-fade-in relative overflow-hidden pb-24" dir="rtl">
      <div className="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/arabesque.png')]"></div>
      <div className="absolute -top-20 -right-20 w-64 h-64 bg-[#D4AF37]/20 rounded-full blur-3xl"></div>
      <div className="absolute -bottom-20 -left-20 w-64 h-64 bg-[#D4AF37]/10 rounded-full blur-3xl"></div>
      
      <div className="relative z-10 flex flex-col items-center w-full max-w-md">
        <div className="w-32 h-32 bg-white/5 rounded-[30px] rotate-6 flex items-center justify-center mb-10 animate-bounce-slow backdrop-blur-md border border-[#D4AF37]/30 shadow-2xl">
          <CheckCircle className="w-16 h-16 text-[#D4AF37] -rotate-6" />
        </div>
        
        <h2 className="text-4xl font-black font-cairo mb-3 text-white">فتح الله عليك</h2>
        <p className="text-[#E8E6E1] mb-12 text-lg font-cairo opacity-90">أتممت وردك اليومي بنجاح وتقبل الله منك</p>

        <div className="bg-[#0F2E1B]/50 backdrop-blur-md rounded-[24px] p-6 w-full mb-8 border border-[#D4AF37]/20 shadow-xl">
          <div className="flex justify-between items-center mb-4 border-b border-[#ffffff]/10 pb-4">
            <span className="text-[#E8E6E1] font-cairo">الصفحات المنجزة</span>
            <span className="font-bold text-2xl font-cairo text-[#D4AF37]">{pagesReadToday}</span>
          </div>
          <div className="flex justify-between items-center">
            <span className="text-[#E8E6E1] font-cairo">الوقت المستغرق</span>
            <span className="font-bold text-2xl font-cairo text-[#D4AF37]">12 دقيقة</span>
          </div>
        </div>

        {/* Daily Reminder Toggle */}
        <div className="bg-[#0F2E1B]/50 backdrop-blur-md rounded-[24px] p-5 w-full mb-8 border border-[#D4AF37]/20 shadow-xl">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-[#D4AF37]/20 rounded-xl flex items-center justify-center">
                <Bell className="w-5 h-5 text-[#D4AF37]" />
              </div>
              <div>
                <p className="text-white font-cairo font-bold text-sm">التذكير اليومي</p>
                <p className="text-[#E8E6E1]/70 text-xs font-cairo">نذكرك بوردك كل يوم</p>
              </div>
            </div>
            <button
              onClick={async () => {
                if (!notificationsEnabled) {
                  if (!('Notification' in window)) {
                    alert('متصفحك لا يدعم الإشعارات');
                    return;
                  }
                  const permission = await Notification.requestPermission();
                  if (permission === 'granted') {
                    setNotificationsEnabled(true);
                    new Notification('تم تفعيل التذكير! 📖', {
                      body: 'سنذكرك بوردك اليومي الساعة ' + reminderTime,
                      icon: 'icons/icon-192.png',
                      dir: 'rtl'
                    });
                  }
                } else {
                  setNotificationsEnabled(false);
                }
              }}
              className={`w-14 h-8 rounded-full transition-all ${notificationsEnabled ? 'bg-[#D4AF37]' : 'bg-white/20'} relative`}
            >
              <div className={`w-6 h-6 bg-white rounded-full absolute top-1 transition-all shadow ${notificationsEnabled ? 'right-1' : 'left-1'}`}></div>
            </button>
          </div>
          {notificationsEnabled && (
            <div className="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
              <span className="text-[#E8E6E1]/70 text-xs font-cairo">وقت التذكير</span>
              <span className="text-[#D4AF37] font-cairo font-bold">{reminderTime}</span>
            </div>
          )}
        </div>

        <div className="flex gap-4 w-full">
          <button 
            onClick={() => { setPagesReadToday(0); setCurrentView('home'); }}
            className="flex-1 bg-[#FDFBF7] text-[#1A4D2E] py-4 rounded-2xl font-bold font-cairo hover:bg-[#E8E6E1] active:scale-95 transition shadow-lg border border-[#D4AF37]"
          >
            العودة للرئيسية
          </button>
          <button className="p-4 bg-[#D4AF37]/20 rounded-2xl hover:bg-[#D4AF37]/30 active:scale-95 transition border border-[#D4AF37]/40 backdrop-blur-sm text-[#D4AF37]">
            <Share2 className="w-6 h-6" />
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="w-full h-full bg-[#FDFBF7] overflow-hidden relative">
      {currentView === 'home' && <HomeView />}
      {currentView === 'reading' && <ReadingView />}
      {currentView === 'completed' && <CompletedView />}
      
      {isSettingsOpen && <SettingsModal />}
      {isHistoryOpen && <HistoryModal />}
      {isGoalReachedModalOpen && <GoalReachedModal />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
