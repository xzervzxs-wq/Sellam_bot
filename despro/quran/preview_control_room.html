        const ConfirmDialog = ({ isOpen, onClose, onConfirm, title, message, type = 'danger' }) => {
            if (!isOpen) return null;
            const colors = type === 'danger' ? { bg: 'from-red-500/20 to-orange-500/20', border: 'border-red-500/30', icon: 'bg-red-500', btn: 'bg-red-500 hover:bg-red-600' } : { bg: 'from-blue-500/20 to-cyan-500/20', border: 'border-blue-500/30', icon: 'bg-blue-500', btn: 'bg-blue-500 hover:bg-blue-600' };
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={onClose}>

                            <div className="flex gap-3 w-full">

                                <button onClick={onConfirm} className={`flex-1 py-2.5 rounded-xl ${colors.btn} text-white font-bold text-sm transition-colors`}>تأكيد</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SignaturePad = ({ onSave, onClear }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            useEffect(() => {
                const canvas = canvasRef.current;
                const resize = () => { const r = canvas.getBoundingClientRect(); canvas.width = r.width; canvas.height = r.height; const ctx = canvas.getContext('2d'); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = 'white'; };
                resize(); window.addEventListener('resize', resize);
                return () => window.removeEventListener('resize', resize);
            }, []);
            const getCoords = (e) => { const r = canvasRef.current.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
            const start = (e) => { const {x,y} = getCoords(e.nativeEvent); const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.moveTo(x,y); setIsDrawing(true); };
            const draw = (e) => { if(!isDrawing)return; const {x,y} = getCoords(e.nativeEvent); const ctx = canvasRef.current.getContext('2d'); ctx.lineTo(x,y); ctx.stroke(); };
            const stop = () => { if(isDrawing) { canvasRef.current.getContext('2d').closePath(); setIsDrawing(false); } };
            return (
                <div className="flex flex-col gap-2">
                    <div className="border border-slate-600 bg-slate-900 rounded h-32 w-full shadow-inner overflow-hidden cursor-crosshair">
                        <canvas ref={canvasRef} onMouseDown={start} onMouseMove={draw} onMouseUp={stop} onMouseLeave={stop} className="w-full h-full block"/>
                    </div>
                    <div className="flex gap-2 text-xs">
                        <button type="button" onClick={() => onSave(canvasRef.current.toDataURL())} className="bg-indigo-600 px-3 py-1 rounded text-white hover:bg-indigo-500 font-bold">تأكيد</button>
                        <button type="button" onClick={() => { const ctx = canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); onClear(); }} className="bg-slate-700 text-slate-300 px-3 py-1 rounded hover:bg-slate-600 font-bold">مسح</button>

                </div>
            );

            const getCameraStatusColor = (cam) => {

                if (cam.status === 'maintenance') return 'bg-orange-500';
                return 'bg-red-500';

            return (
            <aside className="w-64 glass-panel m-4 ml-0 flex flex-col p-4 flex-shrink-0 h-[calc(100vh-2rem)] sticky top-4">

                    </div>
                    <div>
                        <h2 className="text-white font-bold text-sm">غرفة التحكم</h2>
                        <span className="text-slate-400 text-[10px]">Security Control</span>
                    </div>
                </div>

                <nav className="space-y-1 flex-1 overflow-y-auto custom-scrollbar">
                    <div onClick={() => { setCurrentView('overview'); setSelectedScreenId(null); }} className={`sidebar-item w-full flex items-center gap-3 px-3 py-3 text-sm ${currentView === 'overview' && !selectedScreenId ? 'active text-indigo-400' : 'text-slate-400 hover:text-indigo-300'}`}>
                        <Icon name="LayoutGrid" size={18} />
                        <span>نظرة عامة</span>
                    </div>
                    
                    <div onClick={() => setQuickAccessOpen(!quickAccessOpen)} className="pt-4 pb-2 text-[10px] font-bold text-slate-500 uppercase flex items-center gap-2 cursor-pointer hover:text-slate-400 transition-colors select-none">
                        <Icon name="ChevronLeft" size={12} className={`transition-transform duration-200 ${quickAccessOpen ? '-rotate-90' : ''}`}/>
                        <span>الوصول السريع للشاشات</span>
                        <span className="mr-auto bg-slate-700/50 px-1.5 py-0.5 rounded text-[9px]">{screens.length}</span>
                    </div>
                    <div className={`space-y-1 pr-1 mb-4 overflow-hidden transition-all duration-300 ${quickAccessOpen ? 'max-h-[2000px] opacity-100' : 'max-h-0 opacity-0'}`}>
                        {screens.map(s => (
                            <div key={s.id} className="space-y-0.5">
                                <div className={`sidebar-item w-full flex items-center gap-2 px-3 py-2 text-xs ${selectedScreenId === s.id ? 'active text-indigo-400' : 'text-slate-400 hover:text-indigo-300'}`}>
                                    <button onClick={(e) => toggleScreen(s.id, e)} className="p-0.5 hover:bg-slate-700/50 rounded transition-colors">
                                        <Icon name="ChevronLeft" size={10} className={`transition-transform duration-200 ${expandedScreens[s.id] ? '-rotate-90' : ''}`}/>
                                    </button>
                                    <span className={`w-2 h-2 rounded-full flex-shrink-0 ${s.status === 'active' ? 'bg-green-500' : s.status === 'maintenance' ? 'bg-orange-500' : 'bg-red-500'}`}></span>
                                    <span onClick={() => { setSelectedScreenId(s.id); setCurrentView('screen-view'); }} className="flex-1 cursor-pointer truncate">شاشة {s.charId}</span>
                                    <span className="text-[9px] text-slate-600">{s.cameras.length}</span>
                                </div>
                                <div className={`overflow-hidden transition-all duration-200 ${expandedScreens[s.id] ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                    <div className="mr-4 pr-2 border-r border-slate-700/50 space-y-0.5 py-1">
                                        {s.cameras.map(cam => (

                                                <span className="truncate">{cam.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))} 
                    </div>

                    {currentUser?.role === 'admin' && (
                        <>
                            <div className="pt-4 pb-2 text-[10px] font-bold text-slate-500 uppercase">الإدارة</div>
                            <div onClick={() => setCurrentView('external')} className={`sidebar-item w-full flex items-center gap-3 px-3 py-3 text-sm ${currentView === 'external' ? 'active text-purple-400' : 'text-slate-400 hover:text-purple-300'}`}>
                                <Icon name="Building" size={18} />
                                <span>الأقسام الخارجية</span>
                            </div>
                            <div onClick={() => setCurrentView('policies')} className={`sidebar-item w-full flex items-center gap-3 px-3 py-3 text-sm ${currentView === 'policies' ? 'active text-blue-400' : 'text-slate-400 hover:text-blue-300'}`}>

                            </div>
                        </>
                    )}
                    <div onClick={() => setCurrentView('activity')} className={`sidebar-item w-full flex items-center gap-3 px-3 py-3 text-sm ${currentView === 'activity' ? 'active text-cyan-400' : 'text-slate-400 hover:text-cyan-300'}`}>
                        <Icon name="Activity" size={18} />
                        <span>سجل النشاط</span>

        const PoliciesPanel = ({ policyFiles, setPolicyFiles, setViewingFile, logAction }) => {
            const pdfInputRef = useRef(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            
            const handleUploadPolicy = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (file.type !== 'application/pdf') { alert('يرجى اختيار ملف PDF فقط'); return; }
                if (file.size > 2097152) { alert('حجم الملف كبير جداً. يجب أن يكون أقل من 2MB'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const newFile = { id: Date.now(), name: file.name, size: (file.size / 1024).toFixed(2) + ' KB', date: new Date().toLocaleDateString('en-US'), data: e.target.result };
                    setPolicyFiles([...policyFiles, newFile]);
                    logAction('Policy', `Uploaded file: ${file.name}`);
                };
                reader.readAsDataURL(file);
                event.target.value = null;
            };
            const handleDeletePolicy = () => { if(deleteConfirm) { setPolicyFiles(policyFiles.filter(f => f.id !== deleteConfirm.id)); logAction('Policy', 'Deleted file'); setDeleteConfirm(null); }};
            
            return (

                                        <button onClick={handleAddInc} className="w-full bg-gradient-to-r from-red-500 to-orange-500 text-white rounded-xl p-2.5 text-sm font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-all"><Icon name="Save" size={16}/> حفظ</button>
                                    </div>
                                    <div className="space-y-2">
                                        {cam.incidents?.length > 0 ? cam.incidents.map(i => (
                                            <div key={i.id} className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl hover:bg-slate-800/60 transition-all flex items-start gap-3 group">
                                                <div className="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center shrink-0"><Icon name="AlertTriangle" size={14} className="text-red-400"/></div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-white text-sm truncate">{i.action}</div>
                                                    <div className="flex items-center gap-3 text-[11px] text-slate-500 mt-1">
                                                        <span className="flex items-center gap-1"><Icon name="User" size={10}/> {i.reporter || '-'}</span>
                                                        <span className="flex items-center gap-1"><Icon name="Clock" size={10}/> {i.date}</span>
                                                    </div>
                                                </div>
                                                {currentUser?.role === 'admin' && <button onClick={() => setDeleteConfirm({type: 'incidents', id: i.id, name: i.action})} className="p-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-lg opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" size={14}/></button>}
                                            </div>
                                        )) : <div className="text-center text-slate-500 py-6 text-sm">لا يوجد بلاغات</div>}
                                    </div>
                                </div>
                            )}
                            {activeControlTab === 'maintenance' && (
                                <div className="max-w-2xl mx-auto">
                                    <div className="bg-gradient-to-br from-orange-500/10 to-yellow-500/10 p-5 rounded-2xl border border-orange-500/20 mb-6">
                                        <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-orange-500 flex items-center justify-center"><Icon name="Tool" size={16} className="text-white"/></div> تسجيل صيانة</h3>
                                        <div className="space-y-3">
                                            <input placeholder="اسم الفني" className="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-orange-500 outline-none" value={maintenanceForm.technician} onChange={e=>setMaintenanceForm({...maintenanceForm, technician:e.target.value})}/>
                                            <textarea placeholder="الإجراء المتخذ..." rows="2" className="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-orange-500 outline-none resize-none" value={maintenanceForm.action} onChange={e=>setMaintenanceForm({...maintenanceForm, action:e.target.value})}/>
                                        </div>
                                        <button onClick={handleAddMaint} className="w-full bg-gradient-to-r from-orange-500 to-yellow-500 text-white rounded-xl p-2.5 text-sm font-bold flex items-center justify-center gap-2 mt-3 hover:opacity-90 transition-all"><Icon name="Save" size={16}/> حفظ</button>
                                    </div>
                                    <div className="space-y-2">
                                        {cam.maintenance?.length > 0 ? cam.maintenance.map(m => (
                                            <div key={m.id} className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl hover:bg-slate-800/60 transition-all flex items-start gap-3 group">
                                                <div className="w-8 h-8 rounded-lg bg-orange-500/20 flex items-center justify-center shrink-0"><Icon name="Tool" size={14} className="text-orange-400"/></div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-white text-sm truncate">{m.action}</div>
                                                    <div className="flex items-center gap-3 text-[11px] text-slate-500 mt-1">
                                                        <span className="flex items-center gap-1"><Icon name="User" size={10}/> {m.technician}</span>
                                                        <span className="flex items-center gap-1"><Icon name="Clock" size={10}/> {m.date}</span>
                                                    </div>
                                                </div>
                                                {currentUser?.role === 'admin' && <button onClick={() => setDeleteConfirm({type: 'maintenance', id: m.id, name: m.action})} className="p-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-lg opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" size={14}/></button>}
                                            </div>
                                        )) : <div className="text-center text-slate-500 py-6 text-sm">لا يوجد سجلات</div>}
                                    </div>
                                </div>
                            )}
                            {activeControlTab === 'recordings' && (
                                <div className="max-w-2xl mx-auto">
                                    <div className="bg-gradient-to-br from-purple-500/10 to-pink-500/10 p-5 rounded-2xl border border-purple-500/20 mb-6">
                                        <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-purple-500 flex items-center justify-center"><Icon name="Video" size={16} className="text-white"/></div> طلب تسجيل</h3>
                                        <div className="grid grid-cols-2 gap-3 mb-3">
                                            <input placeholder="رقم السجل" className="bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-purple-500 outline-none" value={recordingForm.recNum} onChange={e=>setRecordingForm({...recordingForm, recNum:e.target.value})}/>
                                            <input placeholder="الجهة الطالبة" className="bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-purple-500 outline-none" value={recordingForm.entity} onChange={e=>setRecordingForm({...recordingForm, entity:e.target.value})}/>
                                            <textarea placeholder="سبب الطلب..." rows="2" className="col-span-2 bg-slate-900/80 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-purple-500 outline-none resize-none" value={recordingForm.reason} onChange={e=>setRecordingForm({...recordingForm, reason:e.target.value})}/>
                                            <div className="col-span-2 bg-slate-900/80 rounded-xl border border-slate-700 overflow-hidden">
                                                <div className="bg-slate-800/50 px-3 py-1.5 text-[11px] text-slate-400 flex items-center gap-1"><Icon name="Edit3" size={10}/> التوقيع</div>
                                                <div className="h-20"><SignaturePad onSave={s => setRecordingForm({...recordingForm, signature:s})} onClear={()=>{}}/></div>
                                            </div>
                                        </div>
                                        <button onClick={handleAddRec} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl p-2.5 text-sm font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-all"><Icon name="Save" size={16}/> حفظ</button>
                                    </div>
                                    <div className="space-y-2">
                                        {cam.recordings?.length > 0 ? cam.recordings.map(r => (
                                            <div key={r.id} className="bg-slate-800/40 border border-slate-700/50 p-3 rounded-xl hover:bg-slate-800/60 transition-all flex items-start gap-3 group">
                                                <div className="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center shrink-0"><Icon name="Video" size={14} className="text-purple-400"/></div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-white text-sm truncate">{r.reason}</div>
                                                    <div className="flex items-center gap-3 text-[11px] text-slate-500 mt-1">
                                                        <span className="flex items-center gap-1"><Icon name="Hashtag" size={10}/> {r.recNum || '-'}</span>
                                                        <span className="flex items-center gap-1"><Icon name="Clock" size={10}/> {r.date}</span>
                                                    </div>
                                                </div>
                                                {r.signature && <img src={r.signature} className="h-6 opacity-70 invert rounded"/>}
                                                {currentUser?.role === 'admin' && <button onClick={() => setDeleteConfirm({type: 'recordings', id: r.id, name: r.reason})} className="p-1.5 text-red-400 hover:bg-red-500 hover:text-white rounded-lg opacity-0 group-hover:opacity-100 transition-all"><Icon name="Trash2" size={14}/></button>}
                                            </div>
                                        )) : <div className="text-center text-slate-500 py-6 text-sm">لا يوجد طلبات</div>}
                                    </div>
                                </div>
                            )}
                            {activeControlTab === 'inspections' && (
                                <div className="max-w-2xl mx-auto">
                                    <div className="bg-gradient-to-br from-green-500/10 to-emerald-500/10 p-5 rounded-2xl border border-green-500/20 mb-4">
                                        <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2"><div className="w-8 h-8 rounded-lg bg-green-500 flex items-center justify-center"><Icon name="CheckSquare" size={16} className="text-white"/></div> قائمة الفحص اليومي</h3>
                                        <div className="space-y-2">
                                            {INSPECTION_ITEMS.map(item => (
                                                <label key={item.id} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all ${inspectionChecks[item.id] ? 'bg-green-500/20 border border-green-500/40' : 'bg-slate-800/50 border border-slate-700/50 hover:border-slate-600'}`}>
                                                    <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all ${inspectionChecks[item.id] ? 'bg-green-500 border-green-500' : 'border-slate-600'}`}>
                                                        {inspectionChecks[item.id] && <Icon name="CheckCircle" size={12} className="text-white"/>}
                                                    </div>
                                                    <Icon name={item.icon} size={16} className={inspectionChecks[item.id] ? 'text-green-400' : 'text-slate-500'}/>
                                                    <span className={`text-sm ${inspectionChecks[item.id] ? 'text-green-300' : 'text-slate-400'}`}>{item.label}</span>
                                                    <input type="checkbox" className="hidden" checked={!!inspectionChecks[item.id]} onChange={e => setInspectionChecks({...inspectionChecks, [item.id]: e.target.checked})}/>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl">
                                        <div className="text-sm text-slate-400">الحالة: <span className={Object.values(inspectionChecks).filter(Boolean).length === INSPECTION_ITEMS.length ? 'text-green-400 font-bold' : 'text-orange-400'}>{Object.values(inspectionChecks).filter(Boolean).length === INSPECTION_ITEMS.length ? 'مكتمل ✓' : `${Object.values(inspectionChecks).filter(Boolean).length}/${INSPECTION_ITEMS.length}`}</span></div>
                                        <button onClick={() => setInspectionChecks({ lens: true, recording: true, angle: true, cables: true })} className="text-xs text-slate-500 hover:text-slate-300 px-2 py-1 rounded hover:bg-slate-700 transition">إعادة تعيين</button>
                                    </div>
                                </div>
                            )}
                        </div>
                        <ConfirmDialog isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} onConfirm={handleDelete} title="حذف السجل" message={`هل أنت متأكد من حذف "${deleteConfirm?.name}"؟`} type="danger"/>
                    </div>
                </div>
            );
        };

        function SecurityDashboard() {
            const load = (k, d) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch { return d; } };
            const [users, setUsers] = useState(() => load('cctv_users_v2', INITIAL_USERS));
            const [screens, setScreens] = useState(() => load('cctv_screens_v2', INITIAL_SCREENS));
            const [externalDepts, setExternalDepts] = useState(() => load('cctv_external_v2', []));
            const [policyFiles, setPolicyFiles] = useState(() => load('cctv_policies_v2', []));
            const [activityLog, setActivityLog] = useState(() => load('cctv_activity_log', []));
            
            const [currentUser, setCurrentUser] = useState(null);
            const [accessCode, setAccessCode] = useState('');
            const [loginError, setLoginError] = useState(false);
            
            const [currentView, setCurrentView] = useState('overview');
            const [selectedScreenId, setSelectedScreenId] = useState(null);
            const [selectedCamera, setSelectedCamera] = useState(null);
            
            const [activeControlTab, setActiveControlTab] = useState('storage');
            const [currentTime, setCurrentTime] = useState(new Date());

            // Forms State
            const [newExternal, setNewExternal] = useState({ deptName: '', camCount: '', storage: '', manager: '', phone: '' });
            const [viewingFile, setViewingFile] = useState(null);
            const pdfInputRef = useRef(null);
            const [newUser, setNewUser] = useState({ name: '', code: '', role: 'viewer' });
            const [adminNewCode, setAdminNewCode] = useState('');
            const fileInputRef = useRef(null);

            const logAction = (action, details) => {
                const now = new Date();
                const date = now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
                const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                const newLog = { id: Date.now(), time: `${date} ${time}`, action, details };
                const updated = [newLog, ...activityLog].slice(0, 50);
                setActivityLog(updated);
                localStorage.setItem('cctv_activity_log', JSON.stringify(updated));
            };

            useEffect(() => { localStorage.setItem('cctv_screens_v2', JSON.stringify(screens)); }, [screens]);
            useEffect(() => { localStorage.setItem('cctv_users_v2', JSON.stringify(users)); }, [users]);
            useEffect(() => { localStorage.setItem('cctv_external_v2', JSON.stringify(externalDepts)); }, [externalDepts]);
            useEffect(() => { localStorage.setItem('cctv_policies_v2', JSON.stringify(policyFiles)); }, [policyFiles]);
            useEffect(() => { const t = setInterval(() => setCurrentTime(new Date()), 1000); return () => clearInterval(t); }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const normalizedCode = accessCode.trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
                const u = users.find(x => x.code === normalizedCode);
                if (u) { setCurrentUser(u); setLoginError(false); } 
                else setLoginError(true);
            };
            
            const updateCameraData = (sid, cid, sec, data, isEdit = false, delId = null) => { 
                setScreens(prev => prev.map(s => s.id !== sid ? s : { 
                    ...s, cameras: s.cameras.map(c => c.id !== cid ? c : { 
                        ...c, [sec]: sec === 'storage' ? { ...c.storage, ...data } : 
                        (delId !== null ? (c[sec]||[]).filter(x => x.id !== delId) : 
                        (isEdit ? (c[sec]||[]).map(x => x.id === data.id ? data : x) : [data, ...(c[sec]||[])]))
                    })
                }));
            };

            const deleteCameraData = (sid, cid, sec, id) => {
                setScreens(prev => prev.map(s => s.id !== sid ? s : {
                    ...s, cameras: s.cameras.map(c => c.id !== cid ? c : {
                        ...c, [sec]: (c[sec] || []).filter(x => x.id !== id)
                    })
                }));
                logAction('Delete', `Deleted ${sec} record`);
            };

            // Entity Handlers
            const handleAddExternal = (e) => { e.preventDefault(); if(newExternal.deptName && newExternal.manager) { setExternalDepts([...externalDepts, { id: Date.now(), ...newExternal }]); setNewExternal({ deptName: '', camCount: '', storage: '', manager: '', phone: '' }); logAction('External', `Added dept: ${newExternal.deptName}`); } };
            const handleDeleteExternal = (id) => { if(confirm('هل أنت متأكد من الحذف؟')) { setExternalDepts(externalDepts.filter(d => d.id !== id)); logAction('External', 'Deleted department'); } };
            
            const handleUploadPolicy = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (file.type !== 'application/pdf') { alert('يرجى اختيار ملف PDF فقط'); return; }
                if (file.size > 2097152) { alert('حجم الملف كبير جداً. يجب أن يكون أقل من 2MB'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const newFile = { id: Date.now(), name: file.name, size: (file.size / 1024).toFixed(2) + ' KB', date: new Date().toLocaleDateString('en-US'), data: e.target.result };
                    setPolicyFiles([...policyFiles, newFile]);
                    logAction('Policy', `Uploaded file: ${file.name}`);
                };
                reader.readAsDataURL(file);
                event.target.value = null;
            };
            const handleDeletePolicy = (id) => { if(confirm('حذف الملف؟')) { setPolicyFiles(policyFiles.filter(f => f.id !== id)); logAction('Policy', 'Deleted file'); } };

            const handleAddUser = (e) => { e.preventDefault(); if (newUser.name && newUser.code) { setUsers([...users, { id: Date.now(), ...newUser }]); setNewUser({ name: '', code: '', role: 'viewer' }); logAction('Admin', `Added user: ${newUser.name}`); } };
            const handleDeleteUser = (id) => { if(confirm('حذف المستخدم؟')) { setUsers(users.filter(u => u.id !== id)); logAction('Admin', 'Deleted user'); } };
            const handleUpdateAdminCode = (e) => { e.preventDefault(); if (adminNewCode) { setUsers(users.map(u => u.role === 'admin' ? { ...u, code: adminNewCode } : u)); setAdminNewCode(''); alert('تم التحديث'); logAction('Admin', 'Updated admin code'); } };
            
            const handleFactoryReset = () => { if(confirm('تحذير: سيتم حذف جميع البيانات. هل أنت متأكد؟')) { setScreens(INITIAL_SCREENS); setUsers(INITIAL_USERS); setExternalDepts([]); setPolicyFiles([]); localStorage.clear(); window.location.reload(); } };
            const handleExportData = () => { const data = { screens, users, externalDepts, policyFiles }; const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download='backup.json'; a.click(); };
            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.screens) setScreens(data.screens);
                        if (data.users) setUsers(data.users);
                        if (data.externalDepts) setExternalDepts(data.externalDepts);
                        if (data.policyFiles) setPolicyFiles(data.policyFiles);
                        logAction('Import', 'Data imported successfully');
                        alert('تم استيراد البيانات بنجاح!');
                    } catch (err) { alert('خطأ في قراءة الملف'); }
                };
                reader.readAsText(file);
                e.target.value = null;
            };


            const totalCameras = screens.reduce((acc, s) => acc + s.cameras.length, 0);
            const totalIncidents = screens.reduce((acc, s) => acc + s.cameras.reduce((cAcc, c) => cAcc + (c.incidents?.length || 0), 0), 0);
            
            if (!currentUser) return (
                <div className="login-screen fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="glass-panel w-full max-w-md p-8 fade-in text-center">
                        <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg"><Icon name="Cctv" size={32} className="text-white" /></div>
                        <h1 className="text-2xl font-bold text-white mb-2">غرفة المراقبة والتحكم CCTV</h1>
                        <p className="text-sm text-slate-400 mb-6">إدارة الأمن والسلامة - الأمن الصحي</p>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="password" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} className="w-full bg-slate-900/60 border border-slate-700/50 rounded-xl px-4 py-3 text-white text-center text-lg tracking-[0.5em] outline-none" placeholder="••••" autoFocus />
                            {loginError && <p className="text-red-400 text-xs">رمز الدخول غير صحيح</p>}
                            <button type="submit" className="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90">تسجيل الدخول</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-[#0f172a] text-slate-200">
                    <Sidebar 
                        screens={screens} 
                        currentView={currentView} 
                        setCurrentView={setCurrentView} 
                        selectedScreenId={selectedScreenId} 
                        setSelectedScreenId={setSelectedScreenId} 
                        setSelectedCamera={setSelectedCamera}
                        currentUser={currentUser} 
                        setCurrentUser={setCurrentUser} 
                    />
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto h-screen">
                        <div className="flex items-center justify-between mb-8">
                            <h1 className="text-xl font-bold text-white">
                                {currentView === 'overview' && 'نظرة عامة'}
                                {currentView === 'screen-view' && 'عرض الشاشة'}
                                {currentView === 'external' && 'الأقسام الخارجية'}
                                {currentView === 'policies' && 'السياسات والملفات'}
                                {currentView === 'admin' && 'لوحة التحكم'}
                                {currentView === 'activity' && 'سجل النشاط'}
                            </h1>
                            <div className="bg-slate-800 text-slate-400 px-3 py-2 rounded-lg font-mono text-xs">{currentUser.name}</div>
                        </div>

                        {currentView === 'overview' && (
                            <Overview 
                                screens={screens} 
                                updateScreens={setScreens}
                                currentUser={currentUser}
                                logAction={logAction}
                                totalCameras={totalCameras} 
                                totalIncidents={totalIncidents} 
                                currentTime={currentTime} 
                                setSelectedScreenId={setSelectedScreenId} 
                                setCurrentView={setCurrentView} 
                            />
                        )}
                        {currentView === 'screen-view' && selectedScreenId && (
                            <ScreenDetail 
                                screens={screens} 
                                updateScreens={setScreens}
                                currentUser={currentUser}
                                selectedScreenId={selectedScreenId} 
                                setSelectedScreenId={setSelectedScreenId} 
                                setCurrentView={setCurrentView} 
                                setSelectedCamera={setSelectedCamera}
                                logAction={logAction}
                            />
                        )}
                        {currentView === 'external' && (
                            <ExternalPanel 
                                externalDepts={externalDepts} 
                                setExternalDepts={setExternalDepts} 
                                newExternal={newExternal} 
                                setNewExternal={setNewExternal} 
                                logAction={logAction} 
                            />
                        )}
                        {currentView === 'policies' && (
                            <PoliciesPanel 
                                policyFiles={policyFiles} 
                                setPolicyFiles={setPolicyFiles} 
                                setViewingFile={setViewingFile} 
                                logAction={logAction} 
                            />
                        )}
                        {currentView === 'admin' && (
                            <AdminPanel 
                                users={users} 
                                setUsers={setUsers} 
                                newUser={newUser} 
                                setNewUser={setNewUser} 
                                adminNewCode={adminNewCode} 
                                setAdminNewCode={setAdminNewCode} 
                                logAction={logAction} 
                                handleFactoryReset={handleFactoryReset} 
                                handleExportData={handleExportData}
                                handleImportData={handleImportData}
                            />
                        )}
                        {currentView === 'activity' && (
                            <ActivityLogPage activityLog={activityLog} />
                        )}
                    </main>

                    <CameraModal 
                        selectedCamera={selectedCamera} 
                        setSelectedCamera={setSelectedCamera} 
                        screens={screens} 
                        updateCameraData={updateCameraData}
                        deleteCameraData={deleteCameraData}
                        activeControlTab={activeControlTab} 
                        setActiveControlTab={setActiveControlTab}
                        currentUser={currentUser}
                        logAction={logAction}
                    />

                    {viewingFile && (
                        <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-8">
                            <div className="bg-slate-900 w-full h-full rounded-2xl flex flex-col p-4">
                                <div className="flex justify-between mb-4"><h3 className="text-white font-bold">{viewingFile.name}</h3><button onClick={() => setViewingFile(null)} className="text-white"><Icon name="X"/></button></div>
                                <iframe src={viewingFile.data} className="flex-1 bg-white rounded-lg"></iframe>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SecurityDashboard />);
    </script>
